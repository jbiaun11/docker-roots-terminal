version: '3.1'

services:
  app:
    build: .
    ports:
      - "8080:8080"  
      - "40022:22"
    stdin_open: true
    platform: linux/amd64
    tty: true
    environment:
      USER_PASSWORD: test_password
  ubuntu:
    build: 
      context: .
      dockerfile: Dockerfile.ssh_server
    ports:
      - "9022:22"
    stdin_open: true
    tty: true
    environment:
      USER_PASSWORD: test_password
  

